<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación</title>
<link rel="icon" href="icono.jpg">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("QUCTn3sYYVJ2oKyt_");
})();
</script>

<style>

body{
margin:0;
background:black;
font-family:Arial;
position:relative;
}

/* IMAGEN */

img{
width:100%;
max-width:420px;
margin:auto;
display:block;
}

/* BOTON */

.confirmar{
position:absolute;
left:50%;
transform:translateX(-50%);
top:58%;

padding:14px 50px;
background:transparent;
border:2px solid #2fa4ff;
color:white;
border-radius:30px;
letter-spacing:2px;
z-index:5;
cursor:pointer;
}

/* MODAL */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
z-index:10;
}

.form{
background:#081828;
padding:25px;
border-radius:12px;
width:280px;
text-align:center;
color:white;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

.enviar{
width:100%;
padding:12px;
border:none;
background:#2fa4ff;
border-radius:20px;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<img src="invitacion1.jpg">

<button class="confirmar" onclick="abrir()">CONFIRMAR</button>

<img src="invitacion2.jpg">

<div class="modal" id="modal">

<div class="form">

<h3>Confirmar asistencia</h3>

<input id="nombre" placeholder="Nombre completo">

<select id="asistencia">
<option>Sí asistiré</option>
<option>No podré asistir</option>
</select>

<button class="enviar" onclick="enviar()">Enviar</button>

</div>

</div>

<script>

function abrir(){
document.getElementById("modal").style.display="flex";
}

function enviar(){

emailjs.send("service_n8ktscm","template_f0x7d1h",{
nombre:document.getElementById("nombre").value,
asistencia:document.getElementById("asistencia").value
}).then(()=>{
alert("Confirmado ❤️");
document.getElementById("modal").style.display="none";
});
}

</script>

</body>
</html>
