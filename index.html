<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Especial</title>
<link rel="icon" href="icono.jpg">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("QUCTn3sYYVJ2oKyt_");
})();
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Arial;
background:url("invitacion.jpg") center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
}

/* capa oscura sobre fondo */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:-1;
}

/* tarjeta principal */

.contenedor{
position:relative;
width:100%;
max-width:420px;
box-shadow:0 0 50px black;
border-radius:12px;
overflow:hidden;
background:black;
}

/* imagen */

.contenedor img{
width:100%;
display:block;
}

/* botón */

.confirmar{
position:absolute;
bottom:22%;
left:50%;
transform:translateX(-50%);
padding:12px 40px;
background:transparent;
border:2px solid #2fa4ff;
color:white;
border-radius:30px;
letter-spacing:2px;
font-size:13px;
cursor:pointer;
}

.confirmar:hover{
background:#2fa4ff;
color:black;
transition:.3s;
}

/* modal */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
padding:20px;
}

.form{
background:#081828;
padding:25px;
border-radius:12px;
width:100%;
max-width:300px;
text-align:center;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
}

.enviar{
width:100%;
padding:12px;
border:none;
background:#2fa4ff;
color:black;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

/* PC */

@media(min-width:900px){
.contenedor{
max-width:380px;
}
}

</style>
</head>

<body>

<div class="contenedor">

<img src="invitacion.jpg">

<button class="confirmar" onclick="abrir()">CONFIRMAR</button>

</div>

<div class="modal" id="modal" onclick="cerrar(event)">

<div class="form">

<h3>Confirmar asistencia</h3>

<input id="nombre" placeholder="Nombre completo">

<select id="asistencia">
<option>Sí asistiré</option>
<option>No podré asistir</option>
</select>

<button class="enviar" onclick="enviar()">Enviar</button>

</div>

</div>

<script>

function abrir(){
document.getElementById("modal").style.display="flex";
}

function cerrar(e){
if(e.target.className=="modal"){
document.getElementById("modal").style.display="none";
}
}

function enviar(){

let nombre=document.getElementById("nombre").value;

if(nombre==""){
alert("Por favor escribe tu nombre");
return;
}

emailjs.send("service_n8ktscm","template_f0x7d1h",{
nombre:nombre,
asistencia:document.getElementById("asistencia").value
}).then(()=>{
alert("Confirmación enviada ❤️");
document.getElementById("modal").style.display="none";
document.getElementById("nombre").value="";
});
}

</script>

</body>
</html>
