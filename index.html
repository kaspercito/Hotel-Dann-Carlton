<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Invitación Especial</title>

<!-- ICONO ARRIBA -->
<link rel="icon" href="icono.jpg">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow-x:hidden;
}

/* CONTENEDOR PRINCIPAL */
.invite{
position:relative;
width:100%;
max-width:420px;
}

/* IMAGEN */
.invite img{
width:100%;
height:auto;
display:block;
}

/* BOTÓN */
.confirmar{
position:absolute;

/* 👇 AQUÍ SUBES O BAJAS EL BOTÓN */
bottom:8%;

left:50%;
transform:translateX(-50%);

padding:14px 50px;
border-radius:40px;

border:2px solid #39b7ff;
background:transparent;

color:white;
font-size:16px;
letter-spacing:3px;

cursor:pointer;

transition:.3s;
}

.confirmar:hover{
background:#39b7ff;
color:black;
}

/* PC GRANDES */
@media(min-width:900px){
.invite{
max-width:380px;
}
}

</style>
</head>

<body>

<div class="invite">

<img src="invitacion.jpg">

<button class="confirmar" onclick="confirmar()">CONFIRMAR</button>

</div>

<script>

function confirmar(){
alert("Gracias por confirmar ❤️");
}

</script>

</body>
</html>
