<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>

<link rel="icon" href="icono.jpg">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("QUCTn3sYYVJ2oKyt_");
})();
</script>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
}

.contenedor{
position:relative;
max-width:420px;
}

.contenedor img{
width:100%;
display:block;
}

/* BOTÓN SOBRE EL PDF */
.confirmar{
position:absolute;
bottom:160px;
left:50%;
transform:translateX(-50%);
padding:14px 35px;
background:#b01616;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

/* FORMULARIO MODAL */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
}

.form{
background:#111;
padding:25px;
border-radius:10px;
text-align:center;
}

input,select{
padding:10px;
margin:8px;
width:230px;
}

</style>
</head>

<body>

<div class="contenedor">

<img src="invitacion.jpg">

<button class="confirmar" onclick="abrir()">CONFIRMAR</button>

</div>

<div class="modal" id="modal">

<div class="form">

<h3>Confirmar asistencia</h3>

<input id="nombre" placeholder="Nombre completo"><br>

<select id="asistencia">
<option>Sí asistiré</option>
<option>No podré asistir</option>
</select><br>

<button onclick="enviar()">Enviar</button>

</div>

</div>

<script>

function abrir(){
document.getElementById("modal").style.display="flex";
}

function enviar(){

let nombre=document.getElementById("nombre").value;

if(nombre==""){
alert("Escribe tu nombre");
return;
}

emailjs.send("service_n8ktscm","template_f0x7d1h",{
nombre:nombre,
asistencia:document.getElementById("asistencia").value
}).then(()=>{
alert("Confirmado ❤️");
document.getElementById("modal").style.display="none";
});
}

</script>

</body>
</html>
