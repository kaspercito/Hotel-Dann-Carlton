<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación</title>
<link rel="icon" href="icono.jpg">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("QUCTn3sYYVJ2oKyt_");
})();
</script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial;
}

/* poster completo */

.poster{
position:relative;
height:100vh;
aspect-ratio:9/16;
max-width:100vw;
}

.poster img{
height:100%;
width:auto;
display:block;
}

/* boton */

.confirmar{
position:absolute;
top:55%;
left:50%;
transform:translateX(-50%);
padding:12px 40px;
background:transparent;
border:2px solid #2fa4ff;
color:white;
border-radius:30px;
letter-spacing:2px;
cursor:pointer;
}

.confirmar:hover{
background:#2fa4ff;
color:black;
}

/* modal */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
}

.form{
background:#081828;
padding:25px;
border-radius:12px;
width:280px;
text-align:center;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

.enviar{
width:100%;
padding:12px;
border:none;
background:#2fa4ff;
border-radius:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="poster">

<img src="invitacion.jpg">

<button class="confirmar" onclick="abrir()">CONFIRMAR</button>

</div>

<div class="modal" id="modal">

<div class="form">

<h3>Confirmar asistencia</h3>

<input id="nombre" placeholder="Nombre completo">

<select id="asistencia">
<option>Sí asistiré</option>
<option>No podré asistir</option>
</select>

<button class="enviar" onclick="enviar()">Enviar</button>

</div>

</div>

<script>

function abrir(){
document.getElementById("modal").style.display="flex";
}

function enviar(){

let nombre=document.getElementById("nombre").value;

if(nombre==""){
alert("Escribe tu nombre");
return;
}

emailjs.send("service_n8ktscm","template_f0x7d1h",{
nombre:nombre,
asistencia:document.getElementById("asistencia").value
}).then(()=>{
alert("Confirmado ❤️");
document.getElementById("modal").style.display="none";
});
}

</script>

</body>
</html>
